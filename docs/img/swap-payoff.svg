<text x="650" y="562" font-family="Segoe Print,Bradley Hand,Comic Sans MS,Chalkboard SE,Comic Neue,Chalkboard,Verdana,sans-serif" font-size="20" font-weight="bold" fill="#ffd93d" text-anchor="middle">How to read this chart</text>
<text x="650" y="596" font-family="Segoe Print,Bradley Hand,Comic Sans MS,Chalkboard SE,Comic Neue,Chalkboard,Verdana,sans-serif" font-size="14.5" font-weight="normal" fill="#e8eaf2" text-anchor="middle">One bar per period. NettingEngine works out both legs and only the difference between them moves.</text>
<text x="650" y="626" font-family="Segoe Print,Bradley Hand,Comic Sans MS,Chalkboard SE,Comic Neue,Chalkboard,Verdana,sans-serif" font-size="14.5" font-weight="normal" fill="#e8eaf2" text-anchor="middle">Pink — floating came in under 10%, so the fixed leg was the pricey one and you top up the gap.</text>
<text x="650" y="656" font-family="Segoe Print,Bradley Hand,Comic Sans MS,Chalkboard SE,Comic Neue,Chalkboard,Verdana,sans-serif" font-size="14.5" font-weight="normal" fill="#e8eaf2" text-anchor="middle">Green — floating overshot 10%, so the swap hands the excess back and your borrowing cost stays put.</text>
<text x="650" y="686" font-family="Segoe Print,Bradley Hand,Comic Sans MS,Chalkboard SE,Comic Neue,Chalkboard,Verdana,sans-serif" font-size="14.5" font-weight="bold" fill="#3ddc84" text-anchor="middle">That is the whole point of the hedge: 10% a year, whichever way the market decides to move.</text>
</svg>
